name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Contract + slots + locale + privacy
        run: node verify/smoke.mjs --public
      - name: Public bundle is clean
        run: node scripts/build-public-bundle.mjs --out /tmp/public-check
